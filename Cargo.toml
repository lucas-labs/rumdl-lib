[package]
name = "rumdl-lib"
version = "0.2.78"
edition = "2024"
rust-version = "1.94.0"
description = "The library of rumdl 0.2.78, trimmed down to what reforge-cli uses"
authors = ["Ruben J. Jongejan <ruben.jongejan@gmail.com>"]
license = "MIT"
repository = "https://github.com/lucas-labs/rumdl-lib"
publish = false

[lib]
name = "rumdl_lib"
crate-type = ["rlib"]

[dependencies]
fancy-regex = "0.17.0"
thiserror = "2.0.20"
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13"
dyn-clone = "1"
unicode-width = "0.2"
